<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>NEON SNAKE // 中国风贪吃蛇</title>
<style>
  :root {
    --neon-cyan: #00f0ff;
    --neon-pink: #ff2d78;
    --neon-purple: #b537f2;
    --neon-green: #39ff6a;
    --bg-deep: #05060f;
    --bg-panel: rgba(10, 14, 30, 0.85);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: var(--bg-deep);
    overflow: hidden;
    font-family: "Segoe UI", "Microsoft YaHei", monospace;
    color: #cfe9ff;
    -webkit-tap-highlight-color: transparent;
  }
  /* ---- 背景城市网格 ---- */
  #bg-grid {
    position: fixed; inset: 0; z-index: 0;
    background:
      linear-gradient(rgba(0,240,255,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,240,255,0.05) 1px, transparent 1px);
    background-size: 44px 44px;
    animation: gridMove 6s linear infinite;
    pointer-events: none;
  }
  @keyframes gridMove {
    from { background-position: 0 0, 0 0; }
    to   { background-position: 0 44px, 44px 0; }
  }
  /* ---- CRT 扫描线 ---- */
  #crt {
    position: fixed; inset: 0; z-index: 50; pointer-events: none;
    background: repeating-linear-gradient(
      to bottom, transparent 0 2px, rgba(0, 0, 0, 0.18) 2px 4px);
    mix-blend-mode: multiply;
  }
  #vignette {
    position: fixed; inset: 0; z-index: 49; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,5,0.75) 100%);
  }
  /* ---- 布局 ---- */
  #stage {
    position: relative; z-index: 10;
    height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px; padding: 12px;
  }
  /* ---- 标题 ---- */
  h1.glitch {
    font-size: clamp(26px, 5vw, 44px);
    font-weight: 900; letter-spacing: 6px;
    color: #fff;
    text-shadow:
      0 0 8px var(--neon-cyan),
      0 0 24px var(--neon-cyan),
      0 0 48px rgba(0,240,255,0.6);
    position: relative;
    user-select: none;
  }
  h1.glitch::before, h1.glitch::after {
    content: attr(data-text);
    position: absolute; inset: 0; overflow: hidden;
  }
  h1.glitch::before {
    color: var(--neon-pink); z-index: -1;
    animation: glitchA 2.8s infinite steps(2, end);
  }
  h1.glitch::after {
    color: var(--neon-cyan); z-index: -2;
    animation: glitchB 3.4s infinite steps(2, end);
  }
  @keyframes glitchA {
    0%, 92% { transform: translate(0,0); clip-path: inset(0 0 100% 0); }
    93% { transform: translate(-4px,2px); clip-path: inset(10% 0 55% 0); }
    96% { transform: translate(4px,-2px); clip-path: inset(60% 0 8% 0); }
    100% { transform: translate(0,0); clip-path: inset(0 0 100% 0); }
  }
  @keyframes glitchB {
    0%, 90% { transform: translate(0,0); clip-path: inset(0 0 100% 0); }
    91% { transform: translate(5px,1px); clip-path: inset(30% 0 40% 0); }
    95% { transform: translate(-5px,-1px); clip-path: inset(70% 0 5% 0); }
    100% { transform: translate(0,0); clip-path: inset(0 0 100% 0); }
  }
  .subtitle {
    font-size: 12px; letter-spacing: 8px; color: rgba(207,233,255,0.55);
    text-transform: uppercase; user-select: none;
  }
  /* ---- HUD ---- */
  #hud {
    display: flex; gap: 18px; align-items: stretch;
    width: min(92vw, 560px);
  }
  .hud-box {
    flex: 1;
    background: var(--bg-panel);
    border: 1px solid rgba(0,240,255,0.35);
    border-radius: 6px;
    padding: 8px 12px;
    text-align: center;
    box-shadow: 0 0 12px rgba(0,240,255,0.15), inset 0 0 18px rgba(0,240,255,0.05);
    position: relative;
  }
  .hud-box::before {
    content: ""; position: absolute; top: -1px; left: 8px; right: 8px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
  }
  .hud-label {
    font-size: 10px; letter-spacing: 3px; color: rgba(207,233,255,0.5);
  }
  .hud-value {
    font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums;
    color: var(--neon-cyan);
    text-shadow: 0 0 10px rgba(0,240,255,0.8);
  }
  .hud-box.pink .hud-value { color: var(--neon-pink); text-shadow: 0 0 10px rgba(255,45,120,0.8); }
  .hud-box.purple .hud-value { color: var(--neon-purple); text-shadow: 0 0 10px rgba(181,55,242,0.8); }
  /* ---- 游戏画布 ---- */
  #game-wrap {
    position: relative;
    border: 1px solid rgba(0,240,255,0.4);
    border-radius: 8px;
    box-shadow:
      0 0 24px rgba(0,240,255,0.25),
      0 0 64px rgba(181,55,242,0.12),
      inset 0 0 32px rgba(0,240,255,0.06);
    background: #070a18;
    line-height: 0;
  }
  canvas { border-radius: 8px; touch-action: none; }
  /* ---- 覆盖层（开始/结束） ---- */
  .overlay {
    position: absolute; inset: 0; z-index: 20;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px;
    background: rgba(4, 6, 16, 0.82);
    backdrop-filter: blur(3px);
    border-radius: 8px;
    line-height: 1.5;
    text-align: center;
  }
  .overlay.hidden { display: none; }
  .overlay .big {
    font-size: clamp(22px, 4.5vw, 34px); font-weight: 900; letter-spacing: 4px;
    color: var(--neon-pink);
    text-shadow: 0 0 12px var(--neon-pink), 0 0 40px rgba(255,45,120,0.5);
  }
  .overlay .big.cyan { color: var(--neon-cyan); text-shadow: 0 0 12px var(--neon-cyan), 0 0 40px rgba(0,240,255,0.5); }
  .overlay .small { font-size: 13px; color: rgba(207,233,255,0.75); letter-spacing: 1px; }
  .btn {
    margin-top: 4px;
    padding: 10px 34px;
    font-size: 15px; font-weight: 700; letter-spacing: 4px;
    color: var(--neon-cyan);
    background: transparent;
    border: 1px solid var(--neon-cyan);
    border-radius: 4px;
    cursor: pointer;
    text-shadow: 0 0 8px rgba(0,240,255,0.8);
    box-shadow: 0 0 14px rgba(0,240,255,0.35), inset 0 0 14px rgba(0,240,255,0.12);
    transition: all 0.15s ease;
    font-family: inherit;
  }
  .btn:hover {
    background: rgba(0,240,255,0.12);
    box-shadow: 0 0 24px rgba(0,240,255,0.6), inset 0 0 20px rgba(0,240,255,0.2);
    transform: translateY(-1px);
  }
  /* ---- 升级提示 ---- */
  #levelup {
    position: absolute; top: 38%; left: 0; right: 0; z-index: 15;
    text-align: center; pointer-events: none;
    font-size: 26px; font-weight: 900; letter-spacing: 6px;
    color: var(--neon-green);
    text-shadow: 0 0 12px var(--neon-green), 0 0 40px rgba(57,255,106,0.5);
    opacity: 0;
  }
  #levelup.show { animation: levelUp 1.1s ease-out forwards; }
  @keyframes levelUp {
    0%   { opacity: 0; transform: translateY(14px) scale(0.85); }
    18%  { opacity: 1; transform: translateY(0) scale(1.05); }
    30%  { transform: translateY(0) scale(1); }
    75%  { opacity: 1; }
    100% { opacity: 0; transform: translateY(-18px); }
  }
  /* ---- 底部提示 ---- */
  #tips {
    font-size: 12px; color: rgba(207,233,255,0.45);
    letter-spacing: 2px; user-select: none; text-align: center;
  }
  kbd {
    display: inline-block; padding: 1px 7px; margin: 0 2px;
    border: 1px solid rgba(0,240,255,0.4); border-radius: 3px;
    font-size: 11px; color: var(--neon-cyan);
    background: rgba(0,240,255,0.06);
    font-family: inherit;
  }
  /* ---- 移动端方向键 ---- */
  #pad {
    display: none;
    grid-template-columns: repeat(3, 62px);
    grid-template-rows: repeat(2, 52px);
    gap: 8px; margin-top: 2px;
  }
  #pad button {
    background: var(--bg-panel);
    border: 1px solid rgba(0,240,255,0.4);
    border-radius: 6px;
    color: var(--neon-cyan);
    font-size: 20px;
    box-shadow: 0 0 10px rgba(0,240,255,0.2);
    touch-action: manipulation;
  }
  #pad button:active { background: rgba(0,240,255,0.2); }
  #pad .up { grid-column: 2; grid-row: 1; }
  #pad .left { grid-column: 1; grid-row: 2; }
  #pad .down { grid-column: 2; grid-row: 2; }
  #pad .right { grid-column: 3; grid-row: 2; }
  @media (pointer: coarse) {
    #pad { display: grid; }
    #tips .pc-only { display: none; }
  }
</style>
</head>
<body>
<div id="bg-grid"></div>
<div id="stage">
  <div>
    <h1 class="glitch" data-text="NEON SNAKE">NEON SNAKE</h1>
    <div class="subtitle">中 国 风 贪 吃 蛇 // CYBER PROTOCOL v2.0</div>
  </div>

  <div id="hud">
    <div class="hud-box">
      <div class="hud-label">SCORE 得分</div>
      <div class="hud-value" id="score">0</div>
    </div>
    <div class="hud-box pink">
      <div class="hud-label">BEST 最高</div>
      <div class="hud-value" id="best">0</div>
    </div>
    <div class="hud-box purple">
      <div class="hud-label">SPEED 速度</div>
      <div class="hud-value" id="speed">1</div>
    </div>
  </div>

  <div id="game-wrap">
    <canvas id="game" width="480" height="480"></canvas>
    <div id="levelup"></div>

    <div class="overlay" id="overlay-start">
      <div class="big cyan">SYSTEM READY</div>
      <div class="small">方向键 / WASD 移动 · 空格暂停<br>吃掉粉色能量核，别撞墙，别咬到自己</div>
      <button class="btn" id="btn-start">启 动</button>
    </div>

    <div class="overlay hidden" id="overlay-over">
      <div class="big">GAME OVER</div>
      <div class="small" id="final-score">本局得分 0</div>
      <button class="btn" id="btn-retry">再 来 一 局</button>
    </div>

    <div class="overlay hidden" id="overlay-pause">
      <div class="big cyan">PAUSED</div>
      <div class="small">按空格或点击按钮继续</div>
      <button class="btn" id="btn-resume">继 续</button>
    </div>
  </div>

  <div id="pad">
    <button class="up" data-dir="up">▲</button>
    <button class="left" data-dir="left">◀</button>
    <button class="down" data-dir="down">▼</button>
    <button class="right" data-dir="right">▶</button>
  </div>

  <div id="tips">
    <span class="pc-only"><kbd>↑↓←→</kbd> / <kbd>WASD</kbd> 移动 · <kbd>Space</kbd> 暂停 · <kbd>Enter</kbd> 重开</span>
    <span>手机可滑动屏幕或使用方向键</span>
  </div>
</div>
<div id="vignette"></div>
<div id="crt"></div>

<script>
(() => {
  // ================= 基础配置 =================
  const COLS = 24, ROWS = 24;          // 网格
  const CELL = 20;                      // 每格像素
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  canvas.width = COLS * CELL;
  canvas.height = ROWS * CELL;

  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const speedEl = document.getElementById('speed');
  const ovStart = document.getElementById('overlay-start');
  const ovOver = document.getElementById('overlay-over');
  const ovPause = document.getElementById('overlay-pause');
  const finalScoreEl = document.getElementById('final-score');

  const BEST_KEY = 'neon-snake-best';
  let best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10);
  bestEl.textContent = best;

  // ================= 游戏状态 =================
  let snake, dir, nextDir, food, score, speedLevel;
  let running = false, paused = false, dead = false;
  let tickMs, lastTick = 0, rafId = null;
  let particles = [], foodPulse = 0, shake = 0;

  function reset() {
    snake = [{x: 11, y: 12}, {x: 10, y: 12}, {x: 9, y: 12}];
    dir = {x: 1, y: 0};
    nextDir = {x: 1, y: 0};
    score = 0; speedLevel = 1;
    tickMs = 150;
    particles = []; shake = 0;
    dead = false; paused = false;
    spawnFood();
    updateHud();
  }

  function spawnFood() {
    while (true) {
      const f = {
        x: Math.floor(Math.random() * COLS),
        y: Math.floor(Math.random() * ROWS)
      };
      if (!snake.some(s => s.x === f.x && s.y === f.y)) { food = f; return; }
    }
  }

  function updateHud() {
    scoreEl.textContent = score;
    speedEl.textContent = speedLevel;
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      localStorage.setItem(BEST_KEY, String(best));
    }
  }

  // ================= 音效（WebAudio 合成） =================
  let audioCtx = null;
  function beep(freq, dur, type = 'square', vol = 0.06) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + dur);
    } catch (e) { /* 音频不可用时静默 */ }
  }
  const sfxEat = () => { beep(520, 0.08, 'square'); setTimeout(() => beep(780, 0.1, 'square'), 60); };
  const sfxDie = () => { beep(220, 0.25, 'sawtooth', 0.08); setTimeout(() => beep(110, 0.4, 'sawtooth', 0.08), 180); };
  const sfxStart = () => { beep(440, 0.08); setTimeout(() => beep(660, 0.08), 90); setTimeout(() => beep(880, 0.12), 180); };

  // 升级提示
  const levelupEl = document.getElementById('levelup');
  function showLevelUp() {
    levelupEl.textContent = `LEVEL UP · SPEED ${speedLevel}`;
    levelupEl.classList.remove('show');
    void levelupEl.offsetWidth; // 重启动画
    levelupEl.classList.add('show');
    beep(660, 0.08, 'triangle');
    setTimeout(() => beep(990, 0.12, 'triangle'), 90);
  }

  // ================= 粒子 =================
  function burst(gx, gy, color, n = 18) {
    const cx = gx * CELL + CELL / 2, cy = gy * CELL + CELL / 2;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 1 + Math.random() * 3.2;
      particles.push({
        x: cx, y: cy,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 1, decay: 0.02 + Math.random() * 0.03,
        color, size: 1.5 + Math.random() * 2.5
      });
    }
  }

  // ================= 主循环 =================
  function tick() {
    dir = nextDir;
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

    // 撞墙 / 撞自己
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS ||
        snake.some(s => s.x === head.x && s.y === head.y)) {
      gameOver();
      return;
    }
    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      burst(food.x, food.y, '#ff2d78', 22);
      shake = 6;
      sfxEat();
      // 每 50 分提速
      const newLevel = Math.floor(score / 50) + 1;
      if (newLevel !== speedLevel) {
        speedLevel = newLevel;
        tickMs = Math.max(60, 150 - (speedLevel - 1) * 12);
        showLevelUp();
      }
      spawnFood();
      updateHud();
    } else {
      snake.pop();
    }
  }

  function gameOver() {
    dead = true; running = false;
    shake = 14;
    burst(snake[0].x, snake[0].y, '#00f0ff', 40);
    sfxDie();
    finalScoreEl.textContent = `本局得分 ${score} · 历史最高 ${best}`;
    setTimeout(() => ovOver.classList.remove('hidden'), 500);
  }

  // ================= 渲染 =================
  function draw() {
    ctx.save();
    // 屏幕震动
    if (shake > 0.3) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
      shake *= 0.88;
    }
    // 底板
    ctx.fillStyle = '#070a18';
    ctx.fillRect(-20, -20, canvas.width + 40, canvas.height + 40);

    // 内部网格
    ctx.strokeStyle = 'rgba(0,240,255,0.06)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 1; x < COLS; x++) { ctx.moveTo(x * CELL, 0); ctx.lineTo(x * CELL, canvas.height); }
    for (let y = 1; y < ROWS; y++) { ctx.moveTo(0, y * CELL); ctx.lineTo(canvas.width, y * CELL); }
    ctx.stroke();

    // 食物（脉动能量核）
    foodPulse += 0.08;
    const fp = 1 + Math.sin(foodPulse) * 0.18;
    const fx = food.x * CELL + CELL / 2, fy = food.y * CELL + CELL / 2;
    ctx.save();
    ctx.shadowColor = '#ff2d78';
    ctx.shadowBlur = 18 * fp;
    ctx.fillStyle = '#ff2d78';
    ctx.beginPath();
    ctx.arc(fx, fy, CELL * 0.32 * fp, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffd6e6';
    ctx.beginPath();
    ctx.arc(fx, fy, CELL * 0.13 * fp, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 蛇（霓虹渐变 + 发光）
    snake.forEach((seg, i) => {
      const t = i / snake.length;
      const r = Math.round(0 + 181 * t);
      const g = Math.round(240 - 185 * t);
      const b = Math.round(255 - 13 * t);
      const color = `rgb(${r},${g},${b})`;
      const px = seg.x * CELL, py = seg.y * CELL;
      ctx.save();
      ctx.shadowColor = color;
      ctx.shadowBlur = i === 0 ? 16 : 9;
      ctx.fillStyle = color;
      const inset = i === 0 ? 1.5 : 2.5;
      const size = CELL - inset * 2;
      roundRect(ctx, px + inset, py + inset, size, size, i === 0 ? 6 : 4);
      ctx.fill();
      ctx.restore();
      // 蛇头眼睛（垂直于移动方向的两只眼睛，略微前倾）
      if (i === 0) {
        ctx.fillStyle = '#05060f';
        const cx = px + CELL / 2, cy = py + CELL / 2;
        const fwd = 3.5, side = 4.5; // 前移量 / 两侧间距
        // 眼睛1：前移 + 垂直方向偏移
        const e1x = cx + dir.x * fwd - dir.y * side;
        const e1y = cy + dir.y * fwd + dir.x * side;
        // 眼睛2：前移 - 垂直方向偏移
        const e2x = cx + dir.x * fwd + dir.y * side;
        const e2y = cy + dir.y * fwd - dir.x * side;
        ctx.beginPath();
        ctx.arc(e1x, e1y, 2.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(e2x, e2y, 2.2, 0, Math.PI * 2);
        ctx.fill();
      }
    });

    // 粒子
    particles = particles.filter(p => p.life > 0);
    for (const p of particles) {
      p.x += p.vx; p.y += p.vy;
      p.vx *= 0.96; p.vy *= 0.96;
      p.life -= p.decay;
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 8;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function loop(ts) {
    rafId = requestAnimationFrame(loop);
    if (running && !paused && !dead) {
      if (ts - lastTick >= tickMs) {
        lastTick = ts;
        tick();
      }
    }
    draw();
  }

  // ================= 控制 =================
  function setDir(name) {
    if (!running || paused || dead) return;
    const map = {
      up: {x: 0, y: -1}, down: {x: 0, y: 1},
      left: {x: -1, y: 0}, right: {x: 1, y: 0}
    };
    const d = map[name];
    // 禁止 180 度掉头
    if (d.x === -dir.x && d.y === -dir.y) return;
    nextDir = d;
  }

  function startGame() {
    reset();
    running = true;
    lastTick = performance.now();
    ovStart.classList.add('hidden');
    ovOver.classList.add('hidden');
    ovPause.classList.add('hidden');
    sfxStart();
  }

  function togglePause() {
    if (!running || dead) return;
    paused = !paused;
    ovPause.classList.toggle('hidden', !paused);
    if (!paused) lastTick = performance.now();
  }

  document.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
    if (k === 'arrowup' || k === 'w') setDir('up');
    else if (k === 'arrowdown' || k === 's') setDir('down');
    else if (k === 'arrowleft' || k === 'a') setDir('left');
    else if (k === 'arrowright' || k === 'd') setDir('right');
    else if (k === ' ') { running ? togglePause() : startGame(); }
    else if (k === 'enter') { if (!running || dead) startGame(); }
  });

  document.getElementById('btn-start').addEventListener('click', startGame);
  document.getElementById('btn-retry').addEventListener('click', startGame);
  document.getElementById('btn-resume').addEventListener('click', togglePause);
  document.querySelectorAll('#pad button').forEach(b =>
    b.addEventListener('click', () => setDir(b.dataset.dir)));

  // 触屏滑动
  let touchStart = null;
  canvas.addEventListener('touchstart', e => {
    touchStart = {x: e.touches[0].clientX, y: e.touches[0].clientY};
  }, {passive: true});
  canvas.addEventListener('touchend', e => {
    if (!touchStart) return;
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 'right' : 'left');
    else setDir(dy > 0 ? 'down' : 'up');
    touchStart = null;
  }, {passive: true});

  // ================= 启动 =================
  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
